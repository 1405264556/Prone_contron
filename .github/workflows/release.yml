name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: 端到端自测 (Linux, offscreen)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Qt 运行库
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements.txt
      - name: 运行 tests/test_e2e.py
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/test_e2e.py

  build-windows:
    name: 打包 Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-build.txt
      - name: PyInstaller 打包
        run: pyinstaller --noconfirm --distpath dist --workpath build qt_ground_station/python_qt6/DroneGroundStation.spec
      - name: 打包后自检（无界面启动主窗口）
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\DroneGroundStation.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed: $($p.ExitCode)" }
          Get-Content runtime\selftest.txt
      - name: 生成发布包
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev" }
          New-Item -ItemType Directory -Force release/DroneGroundStation | Out-Null
          Copy-Item dist/DroneGroundStation.exe release/DroneGroundStation/
          Copy-Item README.md release/DroneGroundStation/README.md
          Compress-Archive -Path release/DroneGroundStation -DestinationPath "release/DroneGroundStation-$name-win64.zip"
          Copy-Item dist/DroneGroundStation.exe "release/DroneGroundStation-$name.exe"
          Get-ChildItem release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            release/*.zip
            release/*.exe

  release:
    name: 发布 GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: release
      - name: 发布说明
        run: |
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          [ -f "$notes" ] || notes=/dev/null
          cp "$notes" release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: 无人机上位机 ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            release/*.zip
            release/*.exe
